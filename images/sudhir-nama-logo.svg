<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Outer glow -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="white"/>

  <!-- Text with outline + glow -->
  <g filter="url(#glow)">
    <!-- Outer dark stroke -->
    <text x="100%" y="100%" text-anchor="middle"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="250"
          font-weight="bold"
          fill="none"
          stroke="#0a0a0a"
          stroke-width="16">
      SUDHIR'S
    </text>

    <!-- Inner stroke -->
    <text x="100%" y="100%" text-anchor="middle"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="250"
          font-weight="bold"
          fill="none"
          stroke="#1a3f3c"
          stroke-width="8">
      SUDHIR'S
    </text>

    <!-- Main fill -->
    <text x="100%" y="100%" text-anchor="middle"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="250"
          font-weight="bold"
          fill="#4fa39a">
      SUDHIR'S
    </text>
  </g>
</svg>