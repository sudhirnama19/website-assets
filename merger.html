<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>XLSB Smart Merger</title>

<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

<style>

body{
font-family:Segoe UI;
background:#0a0a0a;
color:#eee;
display:flex;
justify-content:center;
padding-top:40px
}

.container{
width:650px;
background:#1a1a1a;
padding:30px;
border-radius:15px;
box-shadow:0 0 25px rgba(0,255,150,0.2)
}

h2{
color:#00ff96;
margin-top:0
}

.upload{
border:2px dashed #00ff96;
padding:35px;
text-align:center;
border-radius:12px;
cursor:pointer;
margin-bottom:20px
}

#log{
background:#000;
color:#00ff96;
padding:12px;
height:180px;
overflow:auto;
font-family:monospace;
font-size:12px;
border-radius:8px;
margin-bottom:20px
}

button{
background:#00ff96;
border:none;
padding:12px;
width:100%;
border-radius:8px;
font-weight:bold;
font-size:16px;
cursor:pointer
}

</style>

</head>

<body>

<div class="container">

<h2>XLSB Smart Merger</h2>

<div class="upload" onclick="picker.click()">
Click to select Excel/XLSB files
<input type="file" id="picker" multiple accept=".xlsb,.xlsx,.xls" hidden>
</div>

<div id="log">System ready...</div>

<button id="mergeBtn" style="display:none">MERGE FILES</button>

</div>

<script>

const picker = document.getElementById("picker")
const logBox = document.getElementById("log")
const mergeBtn = document.getElementById("mergeBtn")

let masterData = []
let filesList = []

function log(msg){
logBox.innerHTML += "<div>"+msg+"</div>"
logBox.scrollTop = logBox.scrollHeight
}

picker.onchange = function(e){

filesList = Array.from(e.target.files)

if(!filesList.length) return

filesList.sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}))

logBox.innerHTML=""

log("Files selected: "+filesList.length)

mergeBtn.style.display="block"

}

mergeBtn.onclick = async function(){

mergeBtn.disabled=true

masterData=[]

for(let i=0;i<filesList.length;i++){

let file = filesList[i]

log("Reading: "+file.name)

const buffer = await file.arrayBuffer()

const wb = XLSX.read(buffer,{type:"array"})

const sheet = wb.Sheets[wb.SheetNames[0]]

let rows = XLSX.utils.sheet_to_json(sheet,{header:1})

if(i>0) rows.shift()

for(let r of rows){
masterData.push(r)
}

log("Rows added: "+rows.length)

rows=null
wb=null

await new Promise(r=>setTimeout(r,200))

}

log("Total rows: "+masterData.length)

log("Rebuilding IDs...")

for(let i=1;i<masterData.length;i++){
masterData[i][0]=i
}

log("Creating master workbook...")

const newWB = XLSX.utils.book_new()
const newWS = XLSX.utils.aoa_to_sheet(masterData)

XLSX.utils.book_append_sheet(newWB,newWS,"Master")

log("Downloading file...")

XLSX.writeFile(newWB,"MASTER_DATASET.xlsb",{bookType:"xlsb",compression:true})

log("Done!")

mergeBtn.disabled=false

}

</script>

</body>
</html>
